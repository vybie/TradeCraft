[package]
name = "tradecraft-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
vibestrader-credential = []

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
tradecraft-core.workspace = true
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
