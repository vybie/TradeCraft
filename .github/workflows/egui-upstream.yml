name: Check egui-charts upstream

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api 'repos/userFRM/egui-charts/releases?per_page=100' --jq '[.[] | select(.draft == false and .prerelease == false)] | first // empty')
          if [[ -z "$release" ]]; then
            echo 'No published stable upstream release found.'
            exit 0
          fi
          tag=$(jq -r .tag_name <<< "$release")
          url=$(jq -r .html_url <<< "$release")
          title="egui-charts release: $tag"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --search "\"$title\" in:title" --json number,title,body | jq -r --arg title "$title" '.[] | select(.title == $title and ((.body // "") | contains("<!-- tradecraft-egui-release-check -->"))) | .number' | head -n 1)
          if [[ -z "$issue" ]]; then
            body=$(printf '<!-- tradecraft-egui-release-check -->\nNew upstream release: %s\n\nReview the release notes and compare with the vendored revision in `vendor/EGUI-CHARTS-UPSTREAM`. Preserve TradeCraft changes and validate the personal Windows, community Windows and macOS builds before adopting an update.' "$url")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            echo "Already tracked: $title (issue #$issue)"
          fi
      - name: Check for upstream commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < vendor/EGUI-CHARTS-UPSTREAM)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid upstream revision'; exit 1; }
          latest=$(gh api repos/userFRM/egui-charts/commits/main --jq .sha)
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,body --jq '.[] | select(.title == "egui-charts upstream update available" and ((.body // "") | contains("<!-- tradecraft-egui-upstream-check -->"))) | .number' | head -n 1)
          if [[ "$base" == "$latest" ]]; then
            echo "Upstream is current: $base"
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment 'The tracked upstream revision is now current.'
            fi
            exit 0
          fi
          comparison=$(gh api "repos/userFRM/egui-charts/compare/$base...$latest")
          status=$(jq -r .status <<< "$comparison")
          ahead=$(jq -r .ahead_by <<< "$comparison")
          behind=$(jq -r .behind_by <<< "$comparison")
          compare_url="https://github.com/userFRM/egui-charts/compare/$base...$latest"
          title='egui-charts upstream update available'
          body=$(printf '<!-- tradecraft-egui-upstream-check -->\nTradeCraft tracks `%s`; upstream main is at `%s`.\n\nComparison: %s\n\nStatus: %s; upstream commits ahead: %s; commits behind: %s.\n\nReview upstream changes while preserving TradeCraft integrations. Run tests, check licensing and validate the personal Windows, community Windows and macOS builds before updating the tracked revision. This check does not update code automatically.' "$base" "$latest" "$compare_url" "$status" "$ahead" "$behind")
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
