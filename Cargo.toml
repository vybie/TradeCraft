[workspace]
members = ["crates/core", "crates/engine", "crates/providers", "crates/ui-egui", "apps/tradecraft", "xtask"]
default-members = ["apps/tradecraft"]
resolver = "3"
exclude = ["vendor/egui-charts", "vendor/egui-charts/terminal"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = "0.4"
chrono-tz = "0.10"
tradecraft-core = { path = "crates/core" }
tradecraft-engine = { path = "crates/engine" }
tradecraft-providers = { path = "crates/providers" }
tradecraft-ui-egui = { path = "crates/ui-egui" }
