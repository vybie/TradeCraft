[package]
name = "tradecraft"
version = "0.1.0"
edition = "2024"

[features]
default = []
vibestrader-credential = []

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "0.37"
egui-charts = { git = "https://github.com/userFRM/egui-charts", rev = "903757218fa4cb5e68741d244c0aaaff8efe260c", default-features = false, features = ["widget", "timezones", "studies"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
